services:
  # ===== PostgreSQL 数据库 =====
  postgres:
    image: postgres:16-alpine
    container_name: gridgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridgo123}
      POSTGRES_DB: ${POSTGRES_DB:-gridgo}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-3307}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridgo} -d ${POSTGRES_DB:-gridgo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gridgo-network

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: gridgo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gridgo-network

  # ===== 后端服务 =====
  server:
    build:
      context: ./gridgo-server
      dockerfile: Dockerfile
    container_name: gridgo-server
    restart: unless-stopped
    env_file:
      - ./docker/.env.docker
    environment:
      # Docker 内部通过服务名访问 PostgreSQL 和 Redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gridgo}:${POSTGRES_PASSWORD:-gridgo123}@postgres:5432/gridgo
      REDIS_URL: redis://redis:6379/0
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "${SERVER_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gridgo-network

  # ===== 前端 + Nginx =====
  web:
    build:
      context: ./gridgo-web
      dockerfile: Dockerfile
    container_name: gridgo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - gridgo-network

# ===== 数据卷 =====
volumes:
  postgres_data:
    name: gridgo-postgres-data
  redis_data:
    name: gridgo-redis-data

# ===== 网络 =====
networks:
  gridgo-network:
    name: gridgo-network
    driver: bridge
