# GridGo 站点 nginx 配置（web 容器内，唯一对外入口；容器 80 → 宿主机 81）
# 站点挂**根路径**（沿用 gridgo-web/nginx.conf 的行为，不做子路径前缀）：
#   - 静态：前端构建产物挂在 /usr/share/nginx/html，SPA 路由回退 index.html
#   - API ：/api/ → http://server:8001/api/（后端路由自带 /api/v1 前缀，nginx 不剥离）
#   - WS  ：/ws/  → http://server:8001/ws/（游戏实时对局长连接）
server {
    listen 80;
    server_name _;   # 有域名后改成你的域名；HTTPS 模板见文末预留段

    # 上传上限（含聊天/资料类请求余量；后端自身亦有限制）
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 前端静态文件 + SPA history 回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由：所有非文件请求回退到 index.html
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理 → 后端（不剥离前缀：前端 axios baseURL = /api/v1）
    location /api/ {
        proxy_pass http://server:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket 反向代理 → 后端（开局/对局实时消息）
    location /ws/ {
        proxy_pass http://server:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源缓存（Vite 产物带内容哈希，可长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ============ HTTPS 预留（生产建议尽快启用）============
